name: CI

on:
  pull_request:
  push:
    branches: [github-action]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: mysql://hanamoa:12345678@127.0.0.1:3333/hanamoadb
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # docker compose 사용
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start MySQL with docker-compose
        run: docker compose up -d mysql

      - name: Wait for MySQL
        run: |
          set -e
          for i in {1..30}; do
            if docker exec hanamoa-mysql mysqladmin ping -h 127.0.0.1 -uhanamoa -p12345678 --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL did not become ready in time"
          docker compose logs mysql
          exit 1

      # Node는 LTS 권장 (Next/Prisma/Biome 호환 안정)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm 커맨드 보장
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
          run_install: false

      # pnpm 캐시 활성화
      - name: Enable pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # CI에서 Prisma 검증을 원하면 주석 해제 
      # - name: Prisma generate
      #   run: pnpm prisma generate
      #
      # - name: Prisma migrate deploy
      #   run: pnpm prisma migrate deploy

      - name: Biome check
        run: pnpm biome check .

      - name: Test
        run: pnpm test --if-present

      - name: Build
        run: pnpm build

      - name: Stop docker compose
        if: always()
        run: docker compose down -v
