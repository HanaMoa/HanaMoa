name: CI

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node check
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm check
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
          run_install: false

      - name: Enable pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Biome check
      - name: Biome check
        run: pnpm biome check . || true

      - name: Test
        run: pnpm test --if-present

      - name: Build
        run: pnpm build
